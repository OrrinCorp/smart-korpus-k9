<!doctype html>
<html lang="uk" data-theme-default="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розумний корпус · К9 ЧНУ — адміністрування</title>
<link rel="stylesheet" href="css/base.css">
<script src="js/ui/icons.js"></script>
<script src="js/core/theme.js"></script>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Меню розділів" aria-controls="drawer" aria-expanded="false"></button>
  <div class="brand">
    <div class="logo" aria-hidden="true">К9</div>
    <div class="brand-t">
      <div class="title">Розумний корпус</div>
      <div class="sub">Корпус № 9 ЧНУ · прототип «Ша-Пі-То»</div>
    </div>
  </div>
  <button class="sys-pill" id="sysPill" title="Стан корпусу — відкрити огляд"><i></i><span>…</span></button>
  <div class="clock" title="Симульований час — використовується для демонстрації">
    <span id="clockDay"></span> <b id="clockTime">--:--</b>
    <span id="clockPair" class="muted small"></span>
    <select id="clockSpeed" title="Швидкість часу">
      <option value="1">×1</option><option value="10">×10</option><option value="60">×60</option><option value="300">×300</option>
    </select>
    <button class="icon-btn" id="clockSet" title="Змінити симульований час"></button>
  </div>
  <div class="top-right">
    <span class="demo-badge" title="Показники згенеровані симулятором, не отримані від реальних систем">демо</span>
    <label class="role-sel" title="Роль користувача"><span class="role-ico"></span>
      <select id="role">
        <option value="guest">Гість / глядач</option>
        <option value="responsible">Відповідальна особа</option>
        <option value="admin">Адміністратор</option>
      </select>
    </label>
    <button class="icon-btn theme-btn" data-theme-toggle aria-label="Перемкнути тему"></button>
  </div>
</header>

<div class="clock-pop card" id="clockPop" hidden>
  <div class="row">
    <label>День <select id="cpDay"></select></label>
    <label>Час <input type="time" id="cpTime" value="09:55"></label>
    <button class="btn primary small" id="cpApply">Застосувати</button>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="small muted">Швидко:</span>
    <button class="btn small" data-quick="1,08:30">Пн 08:30</button>
    <button class="btn small" data-quick="1,09:55">Пн 09:55</button>
    <button class="btn small" data-quick="3,11:15">Ср перерва</button>
    <button class="btn small" data-quick="2,19:30">Вт вечір</button>
    <button class="btn small" data-quick="real">Реальний час</button>
  </div>
</div>

<!-- Меню розділів, що виїжджає зліва -->
<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Розділи" aria-hidden="true">
  <div class="drawer-h">
    <div class="logo" aria-hidden="true">К9</div>
    <div class="grow"><b>Розділи</b><div class="small muted">Оберіть, що показати поверх карти</div></div>
    <button class="icon-btn" id="drawerClose" aria-label="Закрити меню"></button>
  </div>
  <div class="drawer-b" id="tabGroups"></div>
  <div class="drawer-f">
    <button class="d-link" id="tourBtn" title="Покроковий демо-сценарій для захисту"><span class="d-ico" data-i="play"></span>Демо-тур для захисту</button>
  </div>
</nav>

<main class="layout">
  <section class="viewer" id="viewer" aria-label="3D-карта корпусу">
    <div class="v-toolbar">
      <div class="seg view-seg" role="group" aria-label="Вигляд карти">
        <button id="view3d" class="on" title="Об'ємний вигляд корпусу"><span data-i="cube"></span>3D</button>
        <button id="planBtn" title="План поверху — вигляд згори"><span data-i="plan"></span>План</button>
      </div>
      <label class="map-search-w"><span data-i="search"></span><input type="text" id="mapSearch" class="map-search" placeholder="Знайти: Б-310" autocomplete="off" title="Знайти приміщення на карті (Enter)"></label>
      <label class="cm-w" title="Що показувати кольором"><span data-i="layers"></span><select id="colorMode"></select></label>
      <button class="tb-btn" id="devBtn" title="Показати розумні пристрої на плані"><span data-i="radar"></span>Пристрої</button>
    </div>
    <!-- Ліва панель: поверхи + режими перегляду -->
    <div class="v-side">
      <div class="v-floors" id="floors" role="group" aria-label="Поверх"></div>
      <div class="v-views">
        <button class="vbtn" id="explBtn" title="Розвести поверхи по висоті"><span data-i="layers"></span><em>Розсунути</em></button>
        <button class="vbtn" id="lblBtn" title="Підписи всіх приміщень"><span data-i="tag"></span><em>Підписи</em></button>
        <button class="vbtn" id="homeBtn" title="Типовий вигляд"><span data-i="target"></span><em>Скинути</em></button>
      </div>
    </div>
    <div class="v-devpop card" id="devPop" hidden></div>
    <div class="v-legend" id="legend"></div>
    <div class="v-room card" id="roomCard" hidden></div>
    <div class="v-hint small muted">Клік — картка · подвійний клік — модель кімнати</div>
  </section>

  <aside class="panel" id="sidePanel" aria-label="Розділ">
    <div class="panel-h">
      <span class="ph-ico" id="phIco"></span>
      <div class="grow"><div class="ph-t" id="phTitle">Огляд</div><div class="ph-s" id="phSub"></div></div>
      <button class="icon-btn" id="panelMin" title="Згорнути панель"></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button data-tab="overview" class="on">Огляд</button>
      <button data-tab="control">Диспетчерська</button>
      <button data-tab="scenarios">Сценарії</button>
      <button data-tab="rooms">Аудиторії</button>
      <button data-tab="events">Події</button>
      <button data-tab="comfort">Клімат</button>
      <button data-tab="security">Сповіщення <span class="cnt" id="secCnt" hidden></span></button>
      <button data-tab="access">Доступ</button>
      <button data-tab="logs">Журнали</button>
      <button data-tab="energy">Споживання</button>
      <button data-tab="power">Резервне живлення</button>
      <button data-tab="equipment">Пристрої</button>
      <button data-tab="wiring">Комутація</button>
      <button data-tab="territory">Територія</button>
      <button data-tab="settings">Налаштування</button>
    </nav>
    <div class="panel-body" id="panel"></div>
  </aside>
  <button class="panel-open" id="panelOpen" hidden title="Показати панель"><span id="poIco"></span><span id="poTxt">Огляд</span></button>
</main>

<div class="tour card" id="tour" hidden>
  <div class="row"><b id="tourStep"></b><span class="grow"></span><button class="btn small" id="tourClose" aria-label="Закрити">✕</button></div>
  <p id="tourText"></p>
  <div class="row"><button class="btn small" id="tourPrev">← Назад</button><span class="grow"></span><button class="btn primary small" id="tourNext">Далі →</button></div>
</div>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script src="vendor/three/GLTFLoader.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/data/real-schedule.js"></script>
<script src="js/core/schedule-import.js"></script>
<script src="js/data/building.js"></script>
<script src="js/data/territory.js"></script>
<script src="js/data/devices-i3.js"></script>
<script src="js/core/uni-events.js"></script>
<script src="js/core/schedule.js"></script>
<script src="js/core/scenarios.js"></script>
<script src="js/core/power.js"></script>
<script src="js/core/sensors.js"></script>
<script src="js/core/i3-adapter.js"></script>
<script src="js/core/devpower.js"></script>
<script src="js/core/energy.js"></script>
<script src="js/core/security.js"></script>
<script src="js/core/devices.js"></script>
<script src="js/core/wiring.js"></script>
<script src="js/core/faults.js"></script>
<script src="js/core/control.js"></script>
<script src="js/core/logs.js"></script>
<script src="js/viewer/viewer3d.js"></script>
<script src="js/viewer/room-viewer.js"></script>
<script src="js/ui/charts.js"></script>
<script src="js/ui/colormodes.js"></script>
<script src="js/ui/dashboard.js"></script>
<script src="js/ui/admin-tabs.js"></script>
<script src="js/ui/logs-tab.js"></script>
<script src="js/tools/docx.js"></script>
<script src="js/tools/wiring-doc.js"></script>
<script src="js/ui/demo-tour.js"></script>
</body>
</html>
